server.port=${PORT:8081}
spring.application.name=login-service
spring.datasource.url=${POIESIS_AUTH_DB:jdbc:h2:file:./.run-local/auth};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${POIESIS_DB_USER:sa}
spring.datasource.password=${POIESIS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=${POIESIS_H2_CONSOLE:false}
spring.h2.console.path=/h2-console
application.jwt.secret=${POIESIS_JWT_SECRET:6c7def263503a39c18ebb81d68e5ce038a69c9b9449d46bce684bcf289dd8dce}
application.jwt.expiration=${POIESIS_JWT_EXPIRATION:900000}
application.bootstrap-admin.email=${POIESIS_BOOTSTRAP_ADMIN_EMAIL:admin@poiesis.com}
application.bootstrap-admin.password=${POIESIS_BOOTSTRAP_ADMIN_PASSWORD:admin123}
application.auth.cookie.secure=${POIESIS_COOKIE_SECURE:false}

