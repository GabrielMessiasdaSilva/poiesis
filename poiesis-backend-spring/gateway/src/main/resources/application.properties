spring.cloud.gateway.server.webmvc.routes[3].id=relatorio-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://relatorio-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/v1/relatorios/**
spring.cloud.gateway.server.webmvc.routes[4].id=producao-service
