spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.rabbitmq.addresses=amqps://beasdfxx:1jrLlmztDh7dKIAX1dhvOpmdZOjb3d55@jaragua.lmq.cloudamqp.com/beasdfxx

# Apenas o gateway fica exposto; serviços confiam na rede interna.
server.address=127.0.0.1

# Contrato compartilhado com o publicador de pedidos. Cada consumidor mantém sua fila.
application.rabbitmq.exchange=pedido.eventos
application.rabbitmq.routing-key=pedido.criado
application.rabbitmq.queue=relatorio.pedido.criado.queue
