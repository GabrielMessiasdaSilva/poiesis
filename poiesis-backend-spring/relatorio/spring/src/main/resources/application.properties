server.port=8084
spring.application.name=relatorio-service
spring.datasource.url=jdbc:h2:mem:relatorio;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
