
name: Publish Login - Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - "poiesis-backend-spring/login/**"
      - ".github/workflows/deploy-login.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and publish Login
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Login image
        uses: docker/build-push-action@v6
        with:
          context: ./poiesis-backend-spring/login
          file: ./poiesis-backend-spring/login/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/poiesis-login:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/poiesis-login:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
